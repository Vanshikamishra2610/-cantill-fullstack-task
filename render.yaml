# Render Blueprint: one Docker web service + a free Postgres database.
services:
  - type: web
    name: corvo-pr-to-po
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: corvo-db
          property: connectionString
      # Optional AI: set GEMINI_API_KEY (free tier) or ANTHROPIC_API_KEY (paid).
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
databases:
  - name: corvo-db
    plan: free
